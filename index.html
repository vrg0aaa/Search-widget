<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search widget</title>
<style>
  body { margin: 0; background: #151a1d; }

  .widget {
    --bg: #151a1d;
    --ink: #e3eaed;
    --field: #1d2428;
    --line: #34424a;
    --accent: #5bb3cf;
    --accent-ink: #0e1a1f;
    --zoom: 0.75; /* results text/header size: lower = smaller (try 0.6 to 1) */

    box-sizing: border-box;
    width: 220px;
    height: 350px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    background: var(--bg);
    color: var(--ink);
    color-scheme: dark;
    font: 14px/1.4 system-ui, sans-serif;
  }

  .widget form { display: flex; flex-direction: column; gap: 6px; }
  .widget .buttons { display: flex; gap: 6px; }

  .widget input[type="search"] {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
  }
  .widget button {
    flex: 1;
    padding: 7px 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  .widget button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .widget input:focus-visible,
  .widget button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* The results page is drawn at 1/--zoom size inside this box, then shrunk
     by --zoom, so its text and header take up proportionally less room. */
  .widget .frame {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
  }
  .widget iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% / var(--zoom));
    height: calc(100% / var(--zoom));
    border: 0;
    transform: scale(var(--zoom));
    transform-origin: 0 0;
  }
</style>
</head>
<body>

  <!--
    CHANGE THE action URL to your own search page. It must accept the query
    as a GET parameter named "q" and must allow being shown in an iframe.
    Example below: a SearXNG instance running on your own computer.
  -->
  <div class="widget">
    <form action="http://localhost:8080/search" method="get" target="results">
      <input type="search" name="q" placeholder="Search the web" aria-label="Search the web" required>
      <div class="buttons">
        <button type="submit" class="primary">Search</button>
        <button type="submit" formtarget="_blank">New tab</button>
      </div>
    </form>
    <div class="frame">
      <iframe name="results" title="Search results"></iframe>
    </div>
  </div>

</body>
</html>
