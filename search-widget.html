<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search widget</title>
<style>
  :root {
    --ink: #1d2327;
    --field: #ffffff;
    --line: #c9d1d6;
    --accent: #1f6f8b;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6ecef;
      --field: #1b2125;
      --line: #3a454c;
      --accent: #5bb3cf;
      --accent-ink: #0e1a1f;
    }
  }

  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    box-sizing: border-box;
    background: transparent;
    color: var(--ink);
    font: 15px/1.4 system-ui, sans-serif;
  }

  form { display: flex; gap: 6px; }

  input[type="search"] {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
  }
  button {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  iframe {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
  }
</style>
</head>
<body>

  <!--
    CHANGE THE action URL to your own search page. It must accept the query
    as a GET parameter named "q" and must allow being shown in an iframe.
    Example below: a SearXNG instance running on your own computer.
  -->
  <form action="http://localhost:8080/search" method="get" target="results">
    <input type="search" name="q" placeholder="Search the web" aria-label="Search the web" autofocus required>
    <button type="submit" class="primary">Search</button>
    <button type="submit" formtarget="_blank">New tab</button>
  </form>

  <iframe name="results" title="Search results"></iframe>

</body>
</html>
